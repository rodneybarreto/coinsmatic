services:
  coinsmaticdb-serv:
    image: mariadb:10.11
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MARIADB_DATABASE=coinsmaticdb
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASS}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASS}
      - TZ=America/Fortaleza
    volumes:
      - ${HOST_MARIADB_VOLUME}:/var/lib/mysql
    expose:
      - 3306
    networks:
      - coinsmatic-net

networks:
  coinsmatic-net:
    driver: bridge