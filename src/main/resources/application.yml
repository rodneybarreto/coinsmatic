server:
  port: 8080
  servlet:
    context-path: /coinsmatic
  error:
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
    accept-count: 100
    connection-timeout: 20s

spring:
  profiles:
    default: prod
  application:
    name: coinsmatic
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mariadb://localhost:3306/coinsmaticdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        transaction:
          jta:
            platform: false

#actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always